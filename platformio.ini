[platformio]
default_envs = waveshare_esp32_s3_zero
src_dir = firmware

[env:waveshare_esp32_s3_zero]
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = arduino, espidf
platform_packages =
    platformio/framework-arduinoespressif32@~3.20017.0
    platformio/framework-espidf@~3.40407.0
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 2031616
monitor_speed = 115200
build_flags =
    -O3
    -std=gnu++17
    -ffp-contract=off
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
    -std=gnu++14

[env:imu_raw_test]
extends = env:waveshare_esp32_s3_zero
build_flags =
    ${env:waveshare_esp32_s3_zero.build_flags}
    -DRICK_IMU_RAW_TEST=1
